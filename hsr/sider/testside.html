<button id="toTop" aria-label="Til toppen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 14l6-6 6 6"/></svg></button>
<div class="overlay" id="lightbox" hidden><div class="modal"><button class="modal-close" id="lightClose" aria-label="Luk">&times;</button><img class="lightbox-img" id="lightImg" src="" alt=""><div class="lightbox-text"><strong id="lightTitle"></strong><span id="lightDesc"></span></div></div></div>

<script>
(function(){
  var fs = 1;
  function setFs(v){ fs = Math.min(1.7, Math.max(0.85, v)); document.documentElement.style.setProperty("--fs", fs.toFixed(2)); }
  document.getElementById("fontInc").addEventListener("click", function(){ setFs(fs + 0.1); });
  document.getElementById("fontDec").addEventListener("click", function(){ setFs(fs - 0.1); });
  var darkBtn = document.getElementById("darkBtn");
  darkBtn.addEventListener("click", function(){
    var on = document.body.classList.toggle("dark");
    document.getElementById("iconMoon").style.display = on ? "none" : "block";
    document.getElementById("iconSun").style.display = on ? "block" : "none";
  });
  var menuBtn = document.getElementById("menuBtn"), menu = document.getElementById("menu");
  if (menuBtn && menu){
    menuBtn.addEventListener("click", function(){
      var open = menu.hasAttribute("hidden");
      if (open){ menu.removeAttribute("hidden"); } else { menu.setAttribute("hidden",""); }
      menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
    });
    menu.addEventListener("click", function(e){ if (e.target.tagName === "A"){ menu.setAttribute("hidden",""); menuBtn.setAttribute("aria-expanded","false"); } });
  }
  var toTop = document.getElementById("toTop");
  window.addEventListener("scroll", function(){ toTop.classList.toggle("show", window.scrollY > 400); });
  toTop.addEventListener("click", function(){ window.scrollTo({top:0, behavior:"smooth"}); });
  var lb = document.getElementById("lightbox");
  function openLb(fig){
    var img = fig.querySelector("img");
    document.getElementById("lightImg").src = img.src;
    document.getElementById("lightImg").alt = img.alt || "";
    document.getElementById("lightTitle").textContent = fig.getAttribute("data-caption") || "";
    document.getElementById("lightDesc").textContent = fig.getAttribute("data-desc") || "";
    lb.removeAttribute("hidden");
  }
  function closeLb(){ lb.setAttribute("hidden",""); }
  Array.prototype.forEach.call(document.querySelectorAll(".gal-item"), function(fig){
    fig.addEventListener("click", function(){ openLb(fig); });
    fig.addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " "){ e.preventDefault(); openLb(fig); } });
  });
  document.getElementById("lightClose").addEventListener("click", closeLb);
  lb.addEventListener("click", function(e){ if (e.target === lb) closeLb(); });
  var infoBtn = document.getElementById("infoBtn"), infoModal = document.getElementById("infoModal");
  if (infoBtn && infoModal){
    infoBtn.addEventListener("click", function(){ infoModal.removeAttribute("hidden"); });
    document.getElementById("infoClose").addEventListener("click", function(){ infoModal.setAttribute("hidden",""); });
    infoModal.addEventListener("click", function(e){ if (e.target === infoModal) infoModal.setAttribute("hidden",""); });
  }
  document.addEventListener("keydown", function(e){
    if (e.key !== "Escape") return;
    closeLb();
    if (infoModal) infoModal.setAttribute("hidden","");
  });
  /* --- Gem filen: en kopi af siden som den var, da den blev lavet --- */
  var dlBtn = document.getElementById("dlBtn");
  if (dlBtn) dlBtn.addEventListener("click", function(){
    var bar2 = document.getElementById("topbar");
    if (bar2 && bar2.getAttribute("data-mode") !== "auto") bar2 = null;
    var barWasShown = bar2 && bar2.classList.contains("show");
    var wasDark = document.body.classList.contains("dark");
    var fsWas = document.documentElement.style.getPropertyValue("--fs");
    var topWasShown = toTop.classList.contains("show");
    var menuWasOpen = menu && !menu.hasAttribute("hidden");
    if (bar2) bar2.classList.remove("show");
    document.body.classList.remove("dark");
    document.documentElement.style.removeProperty("--fs");
    toTop.classList.remove("show");
    if (menu) menu.setAttribute("hidden", "");
    var full = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    if (bar2 && barWasShown) bar2.classList.add("show");
    if (wasDark) document.body.classList.add("dark");
    if (fsWas) document.documentElement.style.setProperty("--fs", fsWas);
    if (topWasShown) toTop.classList.add("show");
    if (menuWasOpen && menu) menu.removeAttribute("hidden");
    try {
      var blob = new Blob([full], {type:"text/html"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = "testside.html";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch(e){ alert("Filen kunne ikke gemmes her i browseren."); }
  });
  /* --- Hjem-knappen: i "automatisk" vises den kun, hvis filen er del af noget større --- */
  var bar = document.getElementById("topbar");
  if (bar){
    var link = document.getElementById("homeBtn");
    var mode = "always";
    var target = "../index.php";
    function show(){ bar.classList.add("show"); }
    var fromUrl = null;
    try { var p = new URLSearchParams(location.search); fromUrl = p.get("hjem") || p.get("home"); } catch(e){}
    if (fromUrl){ target = fromUrl; }
    link.setAttribute("href", target);
    if (mode === "always" || fromUrl){ show(); }
    else if (mode === "auto"){
      var path = (location.pathname || "").toLowerCase();
      var isIndex = path.charAt(path.length-1) === "/" || path.indexOf("/index.html") === path.length - 11;
      if (!isIndex){
        var shown = false;
        try {
          if (window.matchMedia && (matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches || matchMedia("(display-mode: minimal-ui)").matches)){ show(); shown = true; }
        } catch(e){}
        if (!shown && navigator.standalone === true){ show(); shown = true; }
        if (!shown){
          try {
            if (document.referrer){
              var ref = new URL(document.referrer), here = new URL(location.href);
              var refDir = ref.pathname.slice(0, ref.pathname.lastIndexOf("/"));
              var hereDir = here.pathname.slice(0, here.pathname.lastIndexOf("/"));
              if (ref.origin === here.origin && refDir === hereDir && ref.href !== here.href){ show(); shown = true; }
            }
          } catch(e){}
        }
        if (!shown && (location.protocol === "http:" || location.protocol === "https:")){
          try { fetch(target, {method:"HEAD"}).then(function(r){ if (r && r.ok) show(); }).catch(function(){}); } catch(e){}
        }
      }
    }
  }
})();
</script>
